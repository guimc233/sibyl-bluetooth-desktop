name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否发布到 GitHub Releases'
        required: false
        type: boolean
        default: true
      tag_name:
        description: 'Release 标签版本号 (如 v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Unit Tests (Core protocol)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore test project
        run: dotnet restore tests/SibylEarbuds.Core.Tests/SibylEarbuds.Core.Tests.csproj

      - name: Run unit tests
        run: dotnet test tests/SibylEarbuds.Core.Tests/SibylEarbuds.Core.Tests.csproj -c Release --no-restore --verbosity normal

  build:
    name: Publish ${{ matrix.rid }}
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            artifact: SibylEarbudsManager-win-x64
          - rid: win-arm64
            platform: ARM64
            artifact: SibylEarbudsManager-win-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MSIX Packaging Tools (MrtCore PRI MSBuild tasks) if missing
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          if (-not $vs) { throw "vswhere returned no Visual Studio installation path" }
          Write-Host "Detected Visual Studio: $vs"

          $priTask = Get-ChildItem -Path (Join-Path $vs 'MSBuild') -Recurse -Filter Microsoft.Build.Packaging.Pri.Tasks.dll -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ($priTask) {
            Write-Host "PRI MSBuild task already present: $priTask"
          } else {
            $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            if (-not (Test-Path $vsInstaller)) { throw "vs_installer.exe not found at $vsInstaller" }
            Write-Host "Installing MSIX Packaging Tools..."
            & $vsInstaller modify --installPath $vs --add Microsoft.VisualStudio.ComponentGroup.MSIX.Packaging --quiet --norestart --nocache
            if ($LASTEXITCODE -ne 0) { throw "vs_installer modify failed with exit code $LASTEXITCODE" }
            $priTask = Get-ChildItem -Path (Join-Path $vs 'MSBuild') -Recurse -Filter Microsoft.Build.Packaging.Pri.Tasks.dll -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $priTask) { throw "Microsoft.Build.Packaging.Pri.Tasks.dll still missing under $vs" }
          Write-Host "PRI MSBuild task ready: $priTask"

      - name: Publish WinUI 3 self-contained app
        run: >
          dotnet publish src/SibylEarbuds.App/SibylEarbuds.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          --self-contained true
          -p:WindowsAppSDKSelfContained=true
          -p:PublishSingleFile=false
          -o publish/${{ matrix.rid }}

      - name: Ensure PRI files are published
        shell: pwsh
        run: |
          $binPris = Get-ChildItem -Path src/SibylEarbuds.App/bin -Recurse -Filter "*.pri" -ErrorAction SilentlyContinue
          foreach ($p in $binPris) {
            Write-Host "Discovered built PRI in bin: $($p.FullName)"
            Copy-Item $p.FullName -Destination "publish/${{ matrix.rid }}/$($p.Name)" -Force
            if ($p.Name -ne "resources.pri") {
              Copy-Item $p.FullName -Destination "publish/${{ matrix.rid }}/resources.pri" -Force
            }
          }
          $publishedPris = Get-ChildItem -Path "publish/${{ matrix.rid }}" -Filter "*.pri"
          Write-Host "Published PRI files:"
          $publishedPris | ForEach-Object { Write-Host " - $($_.Name) ($($_.Length) bytes)" }

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine tag name
        id: vars
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            tag="${{ github.event.inputs.tag_name }}"
          else
            tag="v1.0.${{ github.run_number }}"
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: SIBYL Earbuds Manager ${{ steps.vars.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
